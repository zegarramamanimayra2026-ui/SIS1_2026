    <div class="contenido-pagina">
        <h2>Inscripción a Taller de Desarrollo Web</h2>
        
        <p style="text-align: center; color: #555; margin-bottom: 20px;">Llena este formulario sencillo para reservar tu cupo en el próximo seminario de HTML5 y CSS3.</p>

        <div class="contenedor-formulario">
            <form action="#" method="post">
                <label for="nombres">Nombre Completo:</label>
                <input type="text" name="nombres" id="nombres" placeholder="Ej. Mayra Michelle">
                
                <label for="correo">Correo Electrónico:</label>
                <input type="email" name="correo" id="correo" placeholder="tu_correo@email.com">

                <label for="nivel">Nivel de Experiencia:</label>
                <select name="nivel" id="nivel">
                    <option value="">Selecciona tu nivel</option>
                    <option value="principiante">Principiante (Nunca he programado)</option>
                    <option value="intermedio">Intermedio (Conozco lo básico)</option>
                    <option value="avanzado">Avanzado (Busco perfeccionar)</option>
                </select>
                
                <input type="submit" value="INSCRIBIRME AHORA">
            </form>
        </div>
    </div>
